<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uno Flip</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f3efe6;color:#222;transition:background .4s,color .4s}
body.d{background:#1c1826;color:#eee}
#app{max-width:640px;margin:auto;padding:14px;text-align:center}
button,input{font-size:16px;padding:10px 16px;border-radius:8px;border:1px solid #888;margin:4px}
button{cursor:pointer;background:#fff;color:#222}
.card{display:inline-flex;align-items:center;justify-content:center;width:58px;height:86px;border-radius:9px;color:#fff;font-weight:700;margin:3px;border:3px solid #fff;font-size:17px;cursor:pointer;user-select:none;text-shadow:0 1px 2px #0008}
.card.no{opacity:.35;cursor:default}
.card.big{width:90px;height:134px;font-size:26px;cursor:default}
#hand{display:flex;flex-wrap:wrap;justify-content:center}
.pl{display:inline-block;padding:4px 9px;margin:2px;border-radius:6px;background:#8884}
.pl.t{outline:2px solid #e53935}
.dot{width:40px;height:40px;border-radius:50%;border:3px solid #fff;padding:0}
</style></head><body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const LC=['R','Y','G','B'],DC=['P','T','O','V'];
const HEX={R:'#e53935',Y:'#f9a825',G:'#43a047',B:'#1e88e5',P:'#ec407a',T:'#00897b',O:'#fb8c00',V:'#7e57c2',W:'#222'};
const LBL={R:'⇄',S:'⊘',SE:'⊘ all',F:'FLIP','W+2':'W+2',WC:'W+C'};
const shuf=a=>{for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const mk=(cs,sp,wd)=>{const a=[];cs.forEach(c=>{for(let k=0;k<2;k++){for(let n=1;n<=9;n++)a.push({c,v:''+n});sp.forEach(v=>a.push({c,v}))}});for(let k=0;k<4;k++)a.push({c:'W',v:'W'},{c:'W',v:wd});return a};
const deck=()=>{const L=shuf(mk(LC,['+1','R','S','F'],'W+2')),D=shuf(mk(DC,['+5','R','SE','F'],'WC'));return shuf(L.map((l,i)=>({l,d:D[i]})))};
const ok=(c,s,col,top)=>{const f=c[s];return f.c==='W'||col==='any'||f.c===col||f.v===top[s].v};

let peer,hc,conns={},G,V=null,isHost=false,name='',pend=null;
const $=id=>document.getElementById(id);

/* ---------- host logic ---------- */
function host(){
  const code=Math.random().toString(36).slice(2,7).toUpperCase();
  peer=new Peer('unoflip-'+code);
  peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();host()}else alert('Error: '+e.type)});
  peer.on('open',()=>{isHost=true;G={code,started:false,winner:null,players:[{name,id:'host',hand:[],uno:false}]};
    peer.on('connection',c=>{c.on('data',m=>onMsg(c,m));c.on('close',()=>{if(!G.started){G.players=G.players.filter(p=>p.id!==c.peer);delete conns[c.peer];push()}})});
    push()});
}
function onMsg(c,m){
  if(m.t==='join'){
    if(G.started||G.players.length>=8){c.send({t:'err',m:'Room is full or the game already started.'});return}
    G.players.push({name:m.name,id:c.peer,hand:[],uno:false});conns[c.peer]=c;push();return}
  act(G.players.findIndex(p=>p.id===c.peer),m);
}
const nxt=(i,s)=>{const n=G.players.length;return((i+G.dir*s)%n+n)%n};
function dr(i,n,col){
  const p=G.players[i];
  for(let k=0;k<n;k++){
    if(!G.draw.length){const t=G.disc.pop();G.draw=shuf(G.disc);G.disc=[t]}
    if(!G.draw.length)break;
    const c=G.draw.pop();p.hand.push(c);if(col&&c[G.side].c===col)break}
  p.uno=false;
}
function start(){
  Object.assign(G,{started:true,winner:null,dir:1,side:'l',turn:0,drawn:false,draw:deck()});
  G.players.forEach(p=>{p.hand=G.draw.splice(0,7);p.uno=false});
  const k=G.draw.findIndex(c=>/^\d$/.test(c.l.v));
  G.disc=G.draw.splice(k,1);G.color=G.disc[0].l.c;
}
function play(i,ci,ch){
  const p=G.players[i],c=p.hand[ci];
  if(G.turn!==i||!c||!ok(c,G.side,G.color,G.disc[G.disc.length-1]))return;
  const f=c[G.side];
  if(f.c==='W'&&!(G.side==='l'?LC:DC).includes(ch))return;
  p.hand.splice(ci,1);G.disc.push(c);
  if(p.hand.length===1&&!p.uno)dr(i,2);
  p.uno=false;
  if(!p.hand.length){G.winner=i;return}
  G.color=f.c==='W'?ch:f.c;G.drawn=false;
  const n=G.players.length,v=f.v,vi=nxt(i,1);let t=nxt(i,1);
  if(v==='R'){G.dir*=-1;t=n==2?i:nxt(i,1)}
  else if(v==='S')t=nxt(i,2);
  else if(v==='SE')t=i;
  else if(['+1','+5','W+2','WC'].includes(v)){v==='WC'?dr(vi,99,ch):dr(vi,{'+1':1,'+5':5,'W+2':2}[v]);t=nxt(i,2)}
  else if(v==='F'){G.side=G.side==='l'?'d':'l';const nf=c[G.side];G.color=nf.c==='W'?'any':nf.c}
  G.turn=t;
}
function act(i,m){
  if(i<0)return;
  if(m.t==='start'){if(i===0&&G.players.length>1&&(!G.started||G.winner!=null))start()}
  else if(G.started&&G.winner==null){
    const p=G.players[i];
    if(m.t==='uno'&&p.hand.length<=2)p.uno=true;
    else if(m.t==='play')play(i,m.i,m.ch);
    else if(m.t==='draw'&&G.turn===i&&!G.drawn){
      dr(i,1);G.drawn=true;const h=p.hand;
      if(!h.length||!ok(h[h.length-1],G.side,G.color,G.disc[G.disc.length-1])){G.drawn=false;G.turn=nxt(i,1)}}
    else if(m.t==='pass'&&G.turn===i&&G.drawn){G.drawn=false;G.turn=nxt(i,1)}
  }
  push();
}
function push(){
  G.players.forEach((p,i)=>{
    const v={code:G.code,started:G.started,side:G.side,color:G.color,top:G.disc&&G.disc[G.disc.length-1],turn:G.turn,drawn:G.drawn,winner:G.winner,me:i,hand:p.hand,dir:G.dir,pl:G.players.map(q=>({n:q.name,k:q.hand.length}))};
    if(i===0){V=v;render()}else conns[p.id]&&conns[p.id].send({t:'v',v})});
}

/* ---------- client ---------- */
function join(code){
  peer=new Peer();
  peer.on('error',e=>alert('Connection error: '+e.type));
  peer.on('open',()=>{hc=peer.connect('unoflip-'+code);
    hc.on('open',()=>hc.send({t:'join',name}));
    hc.on('data',m=>{if(m.t==='v'){V=m.v;render()}else alert(m.m)})});
}
const send=m=>isHost?act(0,m):hc.send(m);

/* ---------- UI ---------- */
function home(){
  const code=location.hash.slice(1).toUpperCase();
  $('app').innerHTML=`<h1>Uno Flip</h1><input id="nm" placeholder="Your name" maxlength="12"><br>`+
    (code?`<button onclick="go('${code}')">Join room ${code}</button>`:`<button onclick="go()">Create room</button>`);
}
function go(code){
  name=$('nm').value.trim();if(!name){alert('Enter your name');return}
  $('app').innerHTML='Connecting…';code?join(code):host();
}
function pick(i){
  const c=V.hand[i];
  if(V.turn!==V.me||V.winner!=null||!ok(c,V.side,V.color,V.top))return;
  if(c[V.side].c==='W'){pend=i;render()}else send({t:'play',i});
}
function choose(ch){send({t:'play',i:pend,ch});pend=null}
function render(){
  document.body.className=V.side==='d'?'d':'';
  const a=$('app'),link=location.href.split('#')[0]+'#'+V.code;
  const pls=V.pl.map((p,i)=>`<span class="pl${V.started&&i===V.turn?' t':''}">${p.n}${i===V.me?' (you)':''}${V.started?': '+p.k:''}</span>`).join('');
  if(!V.started){
    a.innerHTML=`<h2>Lobby</h2><p>Share this link:<br><b style="word-break:break-all">${link}</b></p><div>${pls}</div>`+
      (V.me===0?`<button onclick="send({t:'start'})"${V.pl.length<2?' disabled':''}>Start game</button>`:'<p>Waiting for host to start…</p>');
    return}
  const mine=V.turn===V.me,t=V.top[V.side],f=c=>c[V.side];
  const cardHtml=(c,cls,i)=>`<div class="card ${cls}" style="background:${HEX[f(c).c]}" ${i>=0?`onclick="pick(${i})"`:''}>${LBL[f(c).v]||f(c).v}</div>`;
  let h=`<div>${pls}</div><p>${V.side==='l'?'Light':'Dark'} side · ${V.dir>0?'clockwise':'counter-clockwise'}</p>`+
    cardHtml(V.top,'big',-1)+
    `<p>${V.color==='any'?'Any color':'Color: <span class="dot" style="display:inline-block;vertical-align:middle;background:'+HEX[V.color]+'"></span>'}</p>`;
  if(V.winner!=null){
    h+=`<h2>🏆 ${V.pl[V.winner].n} wins!</h2>`+(V.me===0?'<button onclick="send({t:\'start\'})">Play again</button>':'');
  }else{
    h+=`<p><b>${mine?'Your turn':V.pl[V.turn].n+"'s turn"}</b></p>`;
    if(pend!=null)h+='<p>Pick a color:</p>'+(V.side==='l'?LC:DC).map(c=>`<button class="dot" style="background:${HEX[c]}" onclick="choose('${c}')"></button>`).join('');
    else{
      if(mine)h+=V.drawn?'<button onclick="send({t:\'pass\'})">Pass</button>':'<button onclick="send({t:\'draw\'})">Draw</button>';
      if(V.hand.length<=2)h+='<button onclick="send({t:\'uno\'})">UNO!</button>';
    }
  }
  h+='<div id="hand">'+V.hand.map((c,i)=>cardHtml(c,mine&&V.winner==null&&ok(c,V.side,V.color,V.top)?'':'no',i)).join('')+'</div>';
  a.innerHTML=h;
}
home();
</script></body></html>
